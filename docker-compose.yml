services:
  user-service:
    build: ./user-service
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - microservices-network

  product-service:
    build: ./product-service
    ports:
      - "3005:3002"
    restart: unless-stopped
    networks:
      - microservices-network

  order-service:
    build: ./order-service
    ports:
      - "3003:3003"
    restart: unless-stopped
    networks:
      - microservices-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    restart: unless-stopped
    networks:
      - microservices-network

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets/gmail-app-password.txt:/etc/alertmanager/secrets/gmail-app-password.txt:ro
      - ./monitoring/ca-bundle.pem:/etc/alertmanager/ca-bundle.pem:ro
    restart: unless-stopped
    networks:
      - microservices-network

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - microservices-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3004:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  grafana-data: