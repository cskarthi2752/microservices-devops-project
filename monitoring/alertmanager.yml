global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'cskarthik2752@gmail.com'
  smtp_auth_username: 'cskarthik2752@gmail.com'
  smtp_auth_password_file: '/etc/alertmanager/secrets/gmail-app-password.txt'
  smtp_require_tls: true
  smtp_tls_config:
    ca_file: /etc/alertmanager/ca-bundle.pem

route:
  receiver: gmail-notifications
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: gmail-notifications
    email_configs:
      - to: 'cskarthik2752@gmail.com'
        send_resolved: true